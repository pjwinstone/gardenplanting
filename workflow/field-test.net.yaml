# field-test.net.yaml — the guided "Circle field test" checklist as a Petri net
# Yellow boxes = you (user steps); grey boxes = app (auto steps). Circles = places; dots = tokens.
# One token per checklist step, coloured by step id. A separate "cursor" token marks the current step.
# Guards are named TypeScript predicates (src/workflows/guided/guards.ts, proposed).
# Replaces the implicit logic in src/workflows/guided/engine.ts (advanceWorkflow / doneWorkflow)
# and the step list in definitions.ts (circleFieldTest).

id: review-field-test
title: Circle field test (guided checklist)
revision: 5   # rev 5: Paul's own garden circle (~12 m, docs/garden-circle.md): edge points EDG01…, tape-diameter, circle-result; calibration Retake always on.
# rev 4: hierarchical — each step instantiates workflow/action.net.yaml for its row pill.
# rev 3: Step 0 Set-up (run config) + header cog; config changes mark dependants 'needs re-check'.
# rev 2: rev 2: Back = roller scroll; Retake and Details (?) are row actions; ONE button row (Tick + Next/Later/Done);
               # Pause, Skip with a note, Tick by hand and Untick live in the Details sheet
glossary_note: >
  Uses step, user step, auto step, token, guard, place, camera position (not "station"),
  tape measurement, baseline, baseline point, focal length, observation log, configuration.
  Old names STN01/STN02/STN03, CAL and "station" are legacy; the app still accepts them as aliases
  when photos are matched to a camera position.

# ---------------------------------------------------------------------------
# Step states (explicit — stored per step in the run, never inferred from the cursor)
# ---------------------------------------------------------------------------
step_states:
  open:            "Not done yet. Shown as an empty circle."
  waiting_for_app: "Open, and the step needs app evidence (baseline saved, photos at a camera position, file saved). Shown as an hourglass."
  ticked_by_you:   "You tapped Tick. Green tick with a hand."
  ticked_by_app:   "The app saw the evidence. Green tick with the app badge."
  ticked_with_reason: "You ticked an evidence step by hand and typed why. Counts as ticked; shown with an amber warning dot."
  skipped_with_note:  "You chose Skip and typed a note. Not ticked; counts as settled; amber warning."
  evidence_failed:    "The app saw evidence but it failed a check (e.g. photo not usable for focal length, wrong tape length). Red error. Still open."
  needs_recheck:      "Was settled, but a Set-up value it depends on changed. Amber ring with a circular arrow. Not settled until re-checked."

settled: [ticked_by_you, ticked_by_app, ticked_with_reason, skipped_with_note]   # only these let the run finish
counts_as_warning: [ticked_with_reason, skipped_with_note]
counts_as_error: [evidence_failed]
counts_as_open_extra: [needs_recheck]   # shown in the header as 'n to re-check'

# ---------------------------------------------------------------------------
# Steps (renamed in plain words). evidence = what the app listens for.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Step 0 — Set-up: the run's assumptions. Top row of the roller; the header cog scrolls to it.
# No separate settings screen. Values are copied into the run and every change is a 'config.changed'
# entry in the run log (old value, new value, time).
# ---------------------------------------------------------------------------
setup:
  id: setup
  n: 0
  title: Set-up
  counted: false          # not part of 'n of 13 ticked'; must be confirmed before Done
  states: [unconfirmed, confirmed, changed_mid_run]
  values:                 # defaults for the Circle field test; units in the label; all editable
    circle_diameter_m: 12.0             # Paul's existing garden circle
    edge_points: 12                     # EDG01…; at least 8
    camera_position_count: 4            # 3 or 4; Position 4 is skipped with a note when 3
    baseline_length_m: 6.000            # BAS01–BAS02, tangential, at least D/2
    calibration_distance_m: 4.0
    camera_positions:                   # distances to BAS01 / BAS02, m; 0 = not taped; at least 2 taped
      position_1: {to_bas01: 14.60, to_bas02: 8.60}
      position_2: {to_bas01: 0,     to_bas02: 0}
      position_3: {to_bas01: 0,     to_bas02: 0}
      position_4: {to_bas01: 7.50,  to_bas02: 13.10}
    tolerances_mm:                      # from workflow/tolerances.json (shared app configuration)
      baseline: 30
      railway: 30
      flower_bed: 100
      tree: 150
      camera_position: 200
      circle_diameter_baseline: 60      # circleDiameterCapBaselineMm: the grade's cap
      circle_diameter_plantable: 100    # circleDiameterCapPlantableMm: reported as plantable pass
  depends_on:             # config key -> steps that must be re-checked when it changes
    circle_diameter_m:     [place-baseline-points, tape-diameter, circle-result]
    edge_points:           [mark-edge-points, circle-result]
    camera_position_count: [camera-3, camera-4, circle-result]
    baseline_length_m:     [place-baseline-points, tape-baseline, laser-check-baseline, camera-1, camera-2, camera-3, camera-4]
    calibration_distance_m: [camera-calibration]
    camera_positions.position_1: [camera-1]
    camera_positions.position_2: [camera-2]
    camera_positions.position_3: [camera-3]
    camera_positions.position_4: [camera-4]
    tolerances_mm.baseline:        [tape-baseline, laser-check-baseline]
    tolerances_mm.camera_position: [camera-1, camera-2, camera-3, camera-4]
    tolerances_mm.circle_diameter_baseline:  [circle-result]
    tolerances_mm.circle_diameter_plantable: [circle-result]
    # railway / flower_bed / tree tolerances: no step in this workflow depends on them

steps:
  - {n: 1,  id: gather-kit,            title: Gather the kit,                         kind: user, evidence: none}
  - {n: 2,  id: place-baseline-points, title: Place the baseline points,              kind: user, evidence: none,
     note: "BAS01, BAS02 outside the circle, tangential, at least D/2 apart."}
  - {n: 3,  id: tape-baseline,         title: Tape the baseline both ways,            kind: user+app,
     evidence: "baseline.saved BAS01–BAS02, tape measurement, offsets 0", note: "You tick when taped; the app ticks when the baseline is saved. Both needed."}
  - {n: 4,  id: laser-check-baseline,  title: Laser check of the baseline,            kind: user, evidence: none,
     note: "Was 'Laser CHK-BASE'. Write the laser reading in the note; do not enter it as a tape measurement."}
  - {n: 5,  id: tape-diameter,         title: Tape the diameter,                      kind: user, evidence: "circle tape form (3 diameters ~60° apart, inside/outside edge)",
     note: "Save diameters stores run.circleTape and ticks the step; a settled circle-result goes to re-check."}
  - {n: 6,  id: mark-edge-points,      title: Mark the edge points,                   kind: user, evidence: none,
     note: "EDG01… on the taped edge, gaps <= 60°, all the way round; IDs from the document marker set (doc.markerSet)."}
  - {n: 7,  id: camera-calibration,    title: Calibration photo (focal length),       kind: app,
     evidence: "1 photo at camera position 'Calibration' (legacy CAL)"}
  - {n: 8,  id: camera-1,              title: Camera position 1 (BAS02 end),          kind: app,
     evidence: "2 photos at camera position 'Position 1'; taped to BAS01 and BAS02"}
  - {n: 9,  id: camera-2,              title: Camera position 2 (far side, beyond BAS02), kind: app,
     evidence: "2 photos at camera position 'Position 2'"}
  - {n: 10, id: camera-3,              title: Camera position 3 (far side, beyond BAS01), kind: app,
     evidence: "2 photos at camera position 'Position 3'"}
  - {n: 11, id: camera-4,              title: Camera position 4 (BAS01 end),          kind: app,
     evidence: "2 photos at camera position 'Position 4'; taped to BAS01 and BAS02"}
  - {n: 12, id: circle-result,         title: Circle result,                          kind: user+app, evidence: none,
     note: "Shows circleVerdict: green / amber / red / not a circle / inconclusive / weak, with plain guidance. You tick after reading."}
  - {n: 13, id: save-to-onedrive,      title: Save to OneDrive,                       kind: app,
     evidence: "cloud.saved while this step is current"}


# ---------------------------------------------------------------------------
# Sub-nets (rev 4). Each step token carries one instance of workflow/action.net.yaml.
# This net sees an instance only as complete (`done`) or not. Camera steps add the guard
# photoUploadVerified on upload_verified; other steps go idle → done by tick / save.
# ---------------------------------------------------------------------------
subnets:
  action: workflow/action.net.yaml
  instances:
    - {step: gather-kit,            net: action, evidence: manual}
    - {step: place-baseline-points, net: action, evidence: manual}
    - {step: tape-baseline,         net: action, evidence: baseline.saved}
    - {step: laser-check-baseline,  net: action, evidence: manual}
    - {step: tape-diameter,         net: action, evidence: manual}
    - {step: mark-edge-points,      net: action, evidence: manual}
    - {step: camera-calibration,    net: action, evidence: photo.uploaded, min_photos: 1, guard: photoUploadVerified, retake: always}
    - {step: camera-1,              net: action, evidence: photo.uploaded, min_photos: 2, guard: photoUploadVerified, retake: always}
    - {step: camera-2,              net: action, evidence: photo.uploaded, min_photos: 2, guard: photoUploadVerified, retake: always}
    - {step: camera-3,              net: action, evidence: photo.uploaded, min_photos: 2, guard: photoUploadVerified, retake: always}
    - {step: camera-4,              net: action, evidence: photo.uploaded, min_photos: 2, guard: photoUploadVerified, retake: always}
    - {step: circle-result,         net: action, evidence: manual}
    - {step: save-to-onedrive,      net: action, evidence: cloud.saved}
  retake_depends_on:   # retaking a step's photos sends these, if settled, to needs_recheck (RETAKE_DEPENDS_ON)
    camera-calibration: [camera-1, camera-2, camera-3, camera-4, circle-result]
  composition: >
    step settled (top net) <=> its action instance is in `done`. Done (finish_run) needs
    allActionsDone(doc, run); otherwise done_go_to_first_open lands on the first step whose
    instance is not done and names it with the sub-net's reason (doneBlocker / doneBlockerNotice).

rename_map:   # old id -> new id (old ids kept as aliases in reconcileRun so saved runs migrate)
  kit: gather-kit
  place-baseline: place-baseline-points
  tape-baseline: tape-baseline
  laser-check: laser-check-baseline
  diameters: tape-diameter
  tape-diameters: tape-diameter
  set-out: mark-edge-points
  set-out-circle: mark-edge-points
  plumb: mark-edge-points
  plumb-canes: mark-edge-points
  cal: camera-calibration
  stn01: camera-1
  stn02: camera-2
  stn03: camera-3
  camera-left: camera-1
  camera-right-near: camera-2
  camera-right-far: camera-3
  save-send: save-to-onedrive

# ---------------------------------------------------------------------------
# Places
# ---------------------------------------------------------------------------
colours:
  step: [gather-kit, place-baseline-points, tape-baseline, laser-check-baseline, tape-diameter,
         mark-edge-points, camera-calibration, camera-1, camera-2, camera-3, camera-4,
         circle-result, save-to-onedrive]

places:
  - {id: setup_config,  label: Set-up values (step 0), note: "Token: the current config version. Read by every check guard."}
  - {id: run_log,       label: Run log, note: "config.changed entries (old -> new), ticks, skips, reasons. Append-only."}
  - {id: needs_recheck, label: Needs a re-check, note: "Amber. Steps whose Set-up inputs changed after they were settled."}
  - {id: not_started,   label: Not started, note: "Token: the run (one)."}
  - {id: run_active,    label: Run active (checklist shown), note: "Token: the run."}
  - {id: run_paused,    label: Run paused (checklist hidden), note: "Token: the run. Nothing is lost; a Resume button stays in the menu."}
  - {id: run_finished,  label: Run finished}
  - {id: cursor,        label: Current step, note: "Token coloured by step id. Exactly one while the run is active."}
  - {id: open,          label: Open steps, note: "Tokens: user steps not yet ticked. Initial marking: all user steps."}
  - {id: waiting_for_app, label: Waiting for app evidence, note: "Tokens: steps whose evidence has not arrived. Initial marking: all app / user+app steps."}
  - {id: evidence_failed, label: Evidence failed (error), note: "Red. Still open."}
  - {id: ticked_by_you, label: Ticked by you}
  - {id: ticked_by_app, label: Ticked by the app}
  - {id: ticked_with_reason, label: Ticked by hand with a reason (warning)}
  - {id: skipped_with_note,  label: Skipped with a note (warning)}
  - {id: app_events,    label: App events, note: "baseline.saved, photo.uploaded (camera position, photo ids), cloud.saved. From the observation log."}

# ---------------------------------------------------------------------------
# Transitions
# ---------------------------------------------------------------------------
transitions:
  - id: start_run
    title: Start the field test
    user: true
    consume: [not_started]
    produce: [run_active, cursor]
    does: "Cursor on step 1. Every step token starts in open or waiting_for_app."

  - id: confirm_setup
    title: Confirm Set-up (step 0)
    user: true
    consume: [setup_config]
    produce: [setup_config, run_log]
    guard: "isCurrentStep(setup, run) && setupValid(values)"
    does: "Run starts on step 0. You check the values in the compact form and tap Confirm. Logged as config.confirmed."

  - id: edit_setup
    title: Edit Set-up (cog or scroll to step 0)
    user: true
    consume: [setup_config]
    produce: [setup_config, run_log]
    guard: "isCurrentStep(setup, run) && setupValid(newValues) && changedKeys(old, new).length > 0"
    does: "Any time, also mid-run. Logged as config.changed with old and new values. Fires mark_recheck."

  - id: mark_recheck
    title: Mark dependants for re-check
    user: false
    consume: [ticked_by_you, ticked_by_app, ticked_with_reason]   # each matching token
    reads: [setup_config, run_log]
    produce: [needs_recheck]
    guard: "dependsOnChanged(step, changedKeys) && isSettled(step)"
    does: "Every settled step that depends on a changed key becomes 'needs re-check'. Skipped steps stay skipped (the note is kept)."

  - id: app_recheck
    title: Re-check stored evidence
    user: false
    consume: [needs_recheck]
    reads: [setup_config, app_events]
    produce: [ticked_by_app]          # or evidence_failed if !evidencePassesChecks with the new values
    guard: "needsAppEvidence(step) && hasStoredEvidence(step)"
    does: "The app re-runs the checks on the photos / baseline already in the observation log. No retake unless it now fails."

  - id: tick_again
    title: Tick again (button row)
    user: true
    consume: [needs_recheck]
    reads: [cursor]
    produce: [ticked_by_you]
    guard: "isCurrentStep(step, run) && isUserStep(step) && !needsAppEvidence(step)"
    does: "User steps (e.g. set out the circle) need you to look again and tick. The reason line says which value changed."

  - id: tick_user_step
    title: Tick (button row, left)
    user: true
    consume: [open]
    reads: [cursor]
    produce: [ticked_by_you]
    guard: "isCurrentStep(step, run) && isUserStep(step)"
    does: "You tap Tick on the current step. For tape-baseline this is half; it stays waiting_for_app until the baseline is saved."

  - id: app_sees_evidence
    title: App sees evidence
    user: false
    consume: [waiting_for_app, app_events]
    produce: [ticked_by_app]
    guard: |
      evidenceMatches(step, event)   // camera position name matches (aliases allowed), photo count >= minPhotos,
                                      // baseline BAS01–BAS02 tape with offsets 0
      && evidencePassesChecks(step, event)
      && (event.type !== 'cloud.saved' || isCurrentStep(step, run))
    does: "Ticks the step whether or not it is current (except Save, which must be current). Shown as 'Ticked by the app'."

  - id: app_rejects_evidence
    title: App rejects evidence
    user: false
    consume: [waiting_for_app, app_events]
    produce: [evidence_failed]
    guard: "evidenceMatches(step, event) && !evidencePassesChecks(step, event)"
    does: "Red error, with the reason (e.g. 'Not usable for focal length — retake at 1×')."

  - id: retry_evidence
    title: Retake (row action)
    user: true
    consume: [evidence_failed]
    produce: [waiting_for_app]
    does: "Inline 'Retake' pill on the current roller row. You retake the photos or re-save the baseline. Old observations are kept in the observation log."

  - id: tick_with_reason
    title: Tick by hand (in Details, with reason)
    user: true
    consume: [waiting_for_app]
    reads: [cursor]
    produce: [ticked_with_reason]
    guard: "isCurrentStep(step, run) && needsAppEvidence(step) && hasReason(note)"
    does: "Replaces 'Tick anyway'. A reason is required. Counts as ticked, flagged amber."

  - id: skip_with_note
    title: Skip with a note (in Details)
    user: true
    consume: [open]          # also enabled from waiting_for_app and evidence_failed
    reads: [cursor]
    produce: [skipped_with_note]
    guard: "isCurrentStep(step, run) && hasNote(note) && isSkippable(step)"
    does: "Settled but not ticked; amber warning. Save to OneDrive is not skippable."

  - id: untick
    title: Untick (in Details)
    user: true
    consume: [ticked_by_you]   # also ticked_with_reason, skipped_with_note
    produce: [open]            # or waiting_for_app if needsAppEvidence(step)
    guard: "isCurrentStep(step, run)"
    does: "Puts the step back. Ticked by the app cannot be unticked by hand (redo the evidence instead)."

  - id: next
    title: Next
    user: true
    consume: [cursor]
    produce: [cursor]
    guard: "isSettled(currentStep(run)) && !isLastStep(run)"
    does: |
      Button row, right. Moves to the next step. NEVER silently skips: while the current step is not settled
      this button reads 'Later' (go_on_waiting) and the step stays open, visible on the roller and counted in the header.

  - id: go_on_waiting
    title: Later (button row)
    user: true
    consume: [cursor]
    produce: [cursor]
    guard: "!isSettled(currentStep(run)) && !isLastStep(run)"
    does: "Shown in place of Next while the step is unsettled. Explicit, visible deferral: the step stays open/waiting and can still be ticked by the app later."

  - id: scroll_roller
    title: Scroll the roller (or tap a row / a count)
    user: true
    consume: [cursor]
    produce: [cursor]
    does: |
      The only way to move back, and a free way to move anywhere. Settling the wheel on a row makes it current.
      Tapping '1 error' / '2 warnings' / 'n open' in the header scrolls to the next step of that kind.
      There is no Back button.

  - id: done_go_to_first_open
    title: Done → first open step
    user: false
    consume: [cursor]
    produce: [cursor]
    guard: "hasUnsettledSteps(run)"
    does: "Done (button row, last step) shows 'Done · N open' when anything is open. Tapping it moves the cursor to the first open (or failed) step and names it with the action sub-net reason, e.g. 'Step 8 Calibration photo: Upload failed: Size mismatch'."

  - id: finish_run
    title: Done
    user: true
    consume: [run_active, cursor]
    reads: [setup_config]
    produce: [run_finished]
    guard: "setupConfirmed(run) && noUnsettledSteps(run) && allActionsDone(doc, run)"
    does: "Only enabled when every step is settled. Summary lists warnings (ticked by hand, skipped) for the record."

  - id: pause_run
    title: Pause (in Details)
    user: true
    consume: [run_active]
    produce: [run_paused]
    does: "Hides the checklist. Cursor and step states are kept. App evidence still ticks steps while paused."

  - id: resume_run
    title: Resume
    user: true
    consume: [run_paused]
    produce: [run_active]

  - id: start_over
    title: Start over
    user: true
    consume: [run_finished]   # also run_active / run_paused, after a confirmation
    produce: [not_started]
    does: "Old run archived under Past runs, notes kept."

ui_only:   # no token moves; listed so every control has a home
  cog_to_setup: "Small cog in the header. Scrolls the roller to step 0 (Set-up). Same as scrolling there by hand. There is no settings screen."
  setup_form:   "When step 0 is current, the compact form replaces the button row (rows of 44 pt fields, Confirm on the right). Long lists (tolerances) open in Details."
  open_details: "Small '?' on the current roller row opens Details: instructions, diagram, note / reason, and the less common actions Tick by hand, Skip with a note, Untick, Pause. Current row only."
  row_pill: "Colour and text from the step's action sub-net only (workflow/action.net.yaml): grey idle, blue in progress, grey uploading, green done, red error + Retake / Retry upload with the reason under the row."
  photo_taps: >
    After a photo on a camera step the tap screen opens: the photo full-screen (pinch to zoom), one 44 pt bar
    naming the next point to tap. What to tap comes from the step's photoTaps in definitions.ts, never a shared
    A / B / Target default. Calibration: ONE rough tap on the sleeve. The app (grey box, sleeveDetect.ts)
    reads the full-size original from IndexedDB, linearises sRGB, finds every band transition at its own local
    mid-level and fits a uniform grid: code length = 19 x pitch = 0.247 m (this, not the paper, feeds fx).
    Paper-end lines (17 mm above, 23 mm below the code) are drawn for display only; the user accepts with
    Save or goes back with Undo. Guard isConfidentSleeve: confidence >= 0.6 (MIN_CONFIDENCE), and hard rejects:
    payload not one of the 61 codebook words, wrong ID when known, edge RMS > 0.25 band, bands < 7 px.
    If not (or original gone, or it does not line up with the preview), the bar asks for the top edge then
    the bottom edge by hand. Stored in photo.measureTaps (SLEEVE, SLEEVE-TOP, SLEEVE-BOTTOM) and
    photo.measureDetection (method auto/manual, confidence, full-res edges). Kept apart from bearings.
    The calibration original is kept in IndexedDB after a verified upload (holdUntilMarked) until the
    sleeve is saved, then deleted as normal (releaseMarkedOriginal).
    Same principle for future targets: rough tap, the app refines.
    Camera positions: the baseline ends (required) and the circle canes the step names ('Not in view' allowed).
    Close (x) keeps the photo; the taps do not gate the step, which still ticks on the verified upload.
  next_opens_nothing: "Next / Later only move the cursor. Only the row pill opens the camera or Save baseline."

guards:   # proposed src/workflows/guided/guards.ts
  allActionsDone: "doneBlocker(doc, steps, run) is undefined: every step's action sub-net (action.net.yaml) is in done (actionNet.ts)."
  isUserStep:          "(step) => step.kind === 'user' || step.kind === 'user+app'"
  needsAppEvidence:    "(step) => step.kind === 'app' || step.kind === 'user+app'"
  isCurrentStep:       "(step, run) => run.currentStepId === step.id"
  isLastStep:          "(run) => stepIndex(run) === def.steps.length - 1"
  isSettled:           "(state) => SETTLED.includes(state.status)"
  isWaiting:           "(state) => state.status === 'waiting_for_app' || state.status === 'evidence_failed'"
  hasReason:           "(note) => note.trim().length >= 3"
  hasNote:             "(note) => note.trim().length >= 3"
  isSkippable:         "(step) => step.id !== 'save-to-onedrive'"
  evidenceMatches:     "(step, event) => matches type + camera position (aliases) + photo count / baseline ends"
  evidencePassesChecks: "(step, event) => photos verified (focal length usable) / tape kind + offsets 0"
  setupValid:          "(v) => v.baseline_length_m > 0 && v.circle_diameter_m > 0 && all camera distances > 0 && tolerances > 0"
  setupConfirmed:      "(run) => run.setup.status !== 'unconfirmed'"
  changedKeys:         "(old, next) => keys whose value differs (deep, dotted paths)"
  dependsOnChanged:    "(step, keys) => keys.some(k => setup.depends_on[k]?.includes(step.id))"
  hasStoredEvidence:   "(step) => the observation log holds matching photos / baseline for this step"
  hasUnsettledSteps:   "(run) => steps.some(s => !isSettled(run.steps[s.id]))"
  noUnsettledSteps:    "(run) => !hasUnsettledSteps(run)"

counts:   # header text, all from step states (never from the cursor position)
  ticked:   "ticked_by_you + ticked_by_app + ticked_with_reason"
  warnings: "ticked_with_reason + skipped_with_note"
  errors:   "evidence_failed"
  open:     "open + waiting_for_app   (errors are counted separately, never twice)"
  recheck:  "needs_recheck — shown as 'n to re-check' (amber), tappable like the other counts"
  header:   "'{ticked} of {total} ticked · {warnings} warnings · {errors} error · {open} open' — zero terms left out; each count is tappable and scrolls the roller to the next step of that kind"
  position: "Shown separately as 'Step {n} of {total}', never next to the word 'ticked'."

setup_in_counts: "Step 0 is not counted in 'of 13'. If unconfirmed, the header shows 'Set-up not confirmed' (tappable)."

bug_this_fixes: >
  Build 0.7.25: Next silently passed the five evidence steps (tape-baseline, cal, stn01-03), the bar showed
  '12/12 · ticked' (position + current step only), and Done only printed '5 steps are still open' and stayed put,
  with no way to hide the bar. See engine.ts:542 advanceWorkflow, engine.ts:588 doneWorkflow, guidedChrome.ts:250.