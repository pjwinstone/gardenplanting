# Petri net for the + Point (Add point) activity.
# kind: user (yellow) | app (grey)
activity: add-point
version: 1

places:
  - id: ready
  - id: layer_picked
  - id: fix_picked
  - id: side_picked
  - id: measured
  - id: strength_ready
  - id: committed

initial:
  ready: 1

transitions:
  - id: pick_layer_rule
    inputs: { ready: 1 }
    outputs: { layer_picked: 1 }
    kind: user
    screen: pick_layer
    label: Pick survey layer
    glossary: [survey_layer]

  - id: pick_fix_option
    inputs: { layer_picked: 1 }
    outputs: { fix_picked: 1 }
    kind: user
    screen: pick_fix
    label: Choose fix option
    guard: has_layer_rule
    glossary: [fix_option]

  - id: pick_side_on_plan
    inputs: { fix_picked: 1 }
    outputs: { side_picked: 1 }
    kind: user
    screen: pick_side
    label: Tap the plan for side
    guard: needs_side_choice
    glossary: [side_choice, plan_tap]

  - id: skip_side_choice
    inputs: { fix_picked: 1 }
    outputs: { side_picked: 1 }
    kind: app
    screen: skip_side
    label: Side not required
    guard: side_not_required

  - id: capture_measurement
    inputs: { side_picked: 1 }
    outputs: { measured: 1 }
    kind: user
    screen: capture_measurement
    label: Tape or photo
    guard: has_side_or_skipped
    glossary: [measurement, tape, photo]

  - id: compute_strength
    inputs: { measured: 1 }
    outputs: { strength_ready: 1 }
    kind: app
    screen: compute_strength
    label: Compute measurement strength
    guard: has_measurement

  - id: accept_green
    inputs: { strength_ready: 1 }
    outputs: { committed: 1 }
    kind: user
    screen: strength_result
    label: Accept (green)
    guard: strength_is_green
    glossary: [measurement_strength, strength_green]

  - id: accept_amber
    inputs: { strength_ready: 1 }
    outputs: { committed: 1 }
    kind: user
    screen: strength_result
    label: Accept and continue
    guard: strength_is_amber
    glossary: [accept_continue, strength_amber]

  - id: redo_red
    inputs: { strength_ready: 1 }
    outputs: { side_picked: 1 }
    kind: user
    screen: strength_result
    label: Redo measurement
    guard: strength_is_red
    glossary: [redo_measurement, strength_red]

  - id: add_more_grey
    inputs: { strength_ready: 1 }
    outputs: { side_picked: 1 }
    kind: user
    screen: strength_result
    label: Add measurement
    guard: strength_is_grey
    glossary: [add_measurement, strength_grey]

  - id: commit_to_garden
    inputs: { committed: 1 }
    outputs: { ready: 1 }
    kind: app
    screen: commit
    label: Write point to garden
    guard: ready_to_commit
