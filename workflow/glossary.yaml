  term: W-test
  short: A blunder test on one observation using its standardised residual |w|.
  long: The w-test uses w_i = v_i / (σ_i √r_i). Critical value 3.29 (α = 0.1%, two-sided). Large |w| can
    name a reading; if two suspects correlate above 0.9, name both and suggest a separating observation.
  category: quality-check
  aliases:
  - standardised residual test
  code_names:
  - w
  - W_CRITICAL
  - w-test
  related:
  - data-snooping
  - measurement-strength
  - mdb
  - chi-squared-test
  - redundancy
- id: data-snooping
  term: Data snooping
  short: Finding and naming likely bad observations using w-tests and correlations.
  long: 'Data snooping runs w-tests across observations and checks, reports plain-words measurement-strength
    flags (for example “rectangle R1: corner at C3 is 1.4° off square”), and avoids auto-dropping when
    suspects are inseparable.'
  category: quality-check
  aliases:
  - blunder hunt
  code_names:
  - data-snooping
  - dropBlunders
  related:
  - w-test
  - measurement-strength
  - chi-squared-test
  - geometric-check
# ---- Decisions 15 Oct 2026 (Paul + Geometry & Maths Advisor) ----
- id: observation-log
  term: Observation log
  short: Every tape measurement, photo click and side choice, kept in the order it was collected.
  long: Nothing is overwritten. The log is the record of the survey; the net says what each entry fixes,
    not the order of calculation. Any change to the log triggers a re-solve.
  category: workflow-model
  aliases:
  - event log
  code_names: []
  related:
  - re-solve
  - history-view
  - tape-measurement
  - photo-click
  - side-choice
- id: re-solve
  term: Re-solve
  short: Recalculating the whole survey from the observation log in one batch Adjust, after any change.
  long: The app reruns one batch least-squares Adjust over all kept observations. It takes milliseconds
    and the answer does not depend on the order observations were taken. Accepted ambers are re-checked
    every time.
  category: workflow-model
  aliases:
  - full re-solve
  code_names: []
  related:
  - adjust
  - observation-log
  - accepted-amber
- id: history-view
  term: History view
  short: The survey as it stood at an earlier date, solved from the log up to that point.
  long: The app solves each prefix of the observation log (everything up to time t). That shows whether
    the survey improved over time and when a problem first appeared in historic data.
  category: app-screen
  aliases: []
  code_names: []
  related:
  - observation-log
  - re-solve
- id: unavailable-point
  term: Unavailable point
  short: A point no longer seen in the latest photos; kept with its old observations, just no new ones.
  long: An unavailable point is not deleted. Its old tape measurements and photo clicks still tie the
    survey together. If it belongs to the default baseline, nothing changes.
  category: survey
  aliases:
  - no longer available
  code_names: []
  related:
  - point
  - deleted-point
  - default-baseline
- id: deleted-point
  term: Deleted point
  short: A point whose data has been removed from the re-solve, for example because it was bad.
  long: Deleting removes the point and its observations from the solve. Every other point then gets one
    of three recalculation states. If a default-baseline point is deleted, the frame is refitted.
  category: survey
  aliases: []
  code_names: []
  related:
  - unavailable-point
  - recalculation-state
  - frame-refit
- id: recalculation-state
  term: Recalculation state
  short: 'After a deletion each point is: recalculable and checked, recalculable but unchecked, or historically surveyed.'
  long: 'Recalculable means the re-solve still fixes both coordinates: full rank, a finite covariance, an
    ellipse within its tolerance class, and no new side-choice ambiguity. Checked also needs r > 0. A point
    that fails is historically surveyed: old coordinates frozen and labelled, not recalculable.'
  category: quality-check
  aliases:
  - historically surveyed
  - recalculable
  code_names: []
  related:
  - deleted-point
  - checked
  - tolerance-class
  - uncertainty-ellipse
  - side-choice
- id: frame-refit
  term: Frame refit
  short: Redefining the frame after a default-baseline point is deleted, so the plan stays in place.
  long: The app fits a best-fit shift and rotation (no scale) to the old coordinates of the surviving baseline
    points, then asks you to choose a new default baseline from well-checked survivors. Ellipses may change.
    Not needed if the point is only unavailable.
  category: survey
  aliases: []
  code_names: []
  related:
  - frame
  - default-baseline
  - deleted-point
  - unavailable-point
- id: accepted-amber
  term: Accepted amber
  short: An amber result you chose to keep; recorded, and everything built on it is flagged.
  long: 'On baseline points amber may be accepted only if |w| is between 1.96 and 3.29, r ≥ 0.13, the ellipse
    is within the tolerance class, and the point is not one of the two default-baseline points. Red and
    grey are never accepted. Dependants show "depends on accepted amber"; if a re-solve turns it red, the
    app blocks.'
  category: quality-check
  aliases:
  - depends on accepted amber
  code_names: []
  related:
  - amber
  - accept-and-continue
  - re-solve
  - w-test
  - default-baseline
- id: remove-duplicate-measurement
  term: Remove duplicate measurement
  short: Taking a repeated tape measurement or photo click out of the solve; the effect shows in closure.
  long: Redo always adds a new tape measurement and never replaces the old one. If two now disagree or
    double up, this action removes one; the change shows in the closing gap and closing uncertainty.
  category: app-screen
  aliases: []
  code_names: []
  related:
  - tape-measurement
  - photo-click
  - closing-gap
  - closing-uncertainty
  - observation-log
- id: configuration
  term: Configuration
  short: Settings such as tolerance limits, editable in the app and stored in a JSON file.
  long: 'Current tolerance limits: railway 30 mm, flower beds 100 mm, trees 150 mm, baseline 30 mm, camera
    position 200 mm. They can be changed in the app; the net and checks read them from configuration.'
  category: app-screen
  aliases:
  - settings
  code_names: []
  related:
  - tolerance-class
  - railway
  - flower-beds
  - trees
  - camera-position
- id: base-grid
  term: Base grid
  short: The garden's grid of base points (BAS01, BAS02, BAS03…), any number of them, placed wherever suits the garden.
  long: 'The base grid is a growing network of base points around the house and garden. BAS01 is the origin
    of a North/East grid and BAS02 the first point taped from it (step "Start the base grid (BAS01, BAS02)").
    Every further point is tied to a point already placed by a taped East offset, a taped North offset and
    a taped diagonal as the check; the app re-adjusts the whole grid after each tie. In the circle field
    test this replaces the word baseline: the step, Set-up and run ids still say baseline (place-baseline-points,
    tape-baseline, baseline_length_m) so saved runs keep loading.'
  category: survey
  aliases:
  - baseline points
  - baseline (field test)
  - base points
  - control network
  code_names:
  - place-baseline-points
  - tape-baseline
  - laser-check-baseline
  - add-base-points
  - baseline_length_m
  - baseTies
  - adjustGridNetwork
  related:
  - base-point
  - two-sleeve-post
  - baseline
- id: base-point
  term: Base point
  short: One point of the base grid, BAS01, BAS02 …, marked by a sleeve on a plumbed post. Always on the base layer.
  long: A base point carries one coded sleeve (BASnn) on a post, or two on a two-sleeve post. The first base
    point is BAS01 at 0,0. Every other one is taped from an existing base point along grid north and grid
    east, with the diagonal as the check (Add point, then Base point). Photo points and edge photos are
    fixed from the base points they can see; aim for at least 3 around the house, and 4 or more in view
    at good angles gives a checked point.
  category: survey
  aliases:
  - BAS point
  - control sleeve
  code_names:
  - BAS01
  - basePointsFor
  related:
  - base-grid
  - two-sleeve-post
- id: two-sleeve-post
  term: Two-sleeve post
  short: A base point with a top sleeve (BASnn) and a bottom sleeve (BASnnB) a known distance apart, which gives a range.
  long: 'For tricky spots where bushes and trees leave only 2 base points in view. The two sleeves sit one
    above the other on the same post, by default 1.2 m apart centre to centre (Set-up; editable per point
    with Save post). In a photo their vertical separation Δy gives the range r = fx · s / Δy. With 3 or
    more base points in view the range is an extra checked reading; with only 2, both on two-sleeve posts,
    the photo is a 2-point fix.'
  category: survey
  aliases:
  - two sleeves
  - top and bottom sleeve
  - post range
  code_names:
  - post_separation_m
  - basePostSeparationM
  - postSeparationM
  - dyPx
  - BAS01B
  related:
  - base-point
  - two-point-fix
  units: m
- id: two-point-fix
  term: 2-point fix (unchecked)
  short: An edge point fixed from only 2 base points, both on two-sleeve posts. Amber at best, never green.
  long: 'Two ranges and the angle between the posts fix the spot; the left/right order of the two posts
    in the photo picks the right side of the line between them. Nothing is left over to check it, so it
    is shown amber with its 95 % ellipse, and grey (calibrate first) unless the step-8 focal length is
    known to 0.5 %. In the S7a simulation (posts 10 m apart, 12 m circle) the ellipse was about 0.3 m
    typical and 0.75 m worst: good enough to find a point, not to pass the circle test on its own.'
  category: quality-check
  aliases:
  - two-point fix
  - 2-point fix
  code_names:
  - twoPointFix
  - TWO_POINT_LABEL
  related:
  - two-sleeve-post
  - reliability-shift
- id: photo-point
  term: Photo point
  short: A point found from photos taken standing on it, on any layer except the base layer.
  long: Stand on the spot and take one or more photos that show base points (you may turn, but not move
    your feet). The app finds the base point sleeves, works out where you stood, and shows how well
    (green, amber, red or grey, and about how many mm). Layers are boundary/railing, path,
    house/structure and bed.
  category: survey
  aliases:
  - observation point
  - measured point (rebuild)
  code_names:
  - photoPointSolve
  - type_photo
  related:
  - base-point
  - point-type
- id: point-type
  term: Point type
  short: The first step of Add point - base point or photo point.
  long: A base point goes on the base grid and is taped. A photo point goes on a layer and is found from
    photos. The choice sets which steps follow on the roller.
  category: app-screen
  code_names:
  - choose_type
  related:
  - base-point
  - photo-point
- id: grid-north
  term: Grid north
  short: The direction you chose as "north" for the base grid, roughly north but not the compass.
  long: Pick a straight line that suits the garden, for example along the back of the house; it may be
    20 to 40 degrees off compass north. All N offsets are taped along it. The difference from compass
    north can be stored later for sun work; the survey does not need it.
  category: survey
  aliases:
  - grid N
  code_names:
  - northM
  - gridToCompassDeg
  related:
  - grid-east
  - base-grid
- id: grid-east
  term: Grid east
  short: Square (90 degrees) to grid north, to the right when facing grid north.
  long: E offsets are taped along grid east. Minus means grid west; a minus N offset means grid south.
  category: survey
  code_names:
  - eastM
  related:
  - grid-north
- id: diagonal-check
  term: Diagonal check
  short: The straight tape from the existing base point to the new one, checked against the N and E tapes.
  long: From the N and E offsets the app knows what the diagonal should be. If the taped diagonal is too
    far off (the w-test is over 3.29) the check fails and Next stays off until you re-tape.
  category: quality-check
  code_names:
  - diagonalM
  - diagonalCheck
  related:
  - base-point
  - w-test
- id: sleeve-separation
  term: Sleeve separation
  short: On a two-sleeve post, the distance from the middle of the top sleeve to the middle of the bottom one.
  long: Default 1.2 m, measured centre to centre (the same as top edge to top edge). If a post needs a
    different gap, measure what you used and enter it for that base point.
  category: measurement
  units: m
  code_names:
  - separationM
  - POST_SEPARATION_DEFAULT_M
  related:
  - two-sleeve-post
- id: circle-test
  term: Circle test
  short: The check of the whole method on a taped circle - photos from the edge points, a circle fit, and the taped diameter.
  long: Edge photos are taken standing on each edge point; the app fits a circle through the solved points
    and compares its diameter with the tape. It opens from Home.
  category: app-screen
  aliases:
  - circle field test
  code_names:
  - circle-field-test
  related:
  - edge-photo
- id: edge-photo
  term: Edge photo
  short: In the circle test, one photo taken standing on one edge point.
  long: Each edge photo should show base points. A Retake replaces just that photo; the new one takes the
    same edge point.
  category: app-screen
  code_names:
  - edge-photos
  related:
  - circle-test
  - retake
- id: retake
  term: Retake
  short: Replace one photo. Tap it in the photo strip, then Retake.
  long: The old photo is kept on record and moved to photos/archive/ on OneDrive; the new photo takes
    its place. The roller does not move.
  category: app-screen
  code_names:
  - retakePhoto
  - retakeOnePhotoInDoc
  related:
  - photo-strip
  - archive
- id: photo-strip
  term: Photo strip
  short: The row of photo thumbnails on every step. Tap one to view or retake it.
  long: Shows every photo of the current run, on every step, not just the step that took it.
  category: app-screen
  related:
  - retake
- id: archive
  term: Archive
  short: Where retaken photos go - photos/archive/ in the garden's OneDrive folder.
  long: Nothing is deleted at once. Old archived photos can be cleaned out later from Tools.
  category: app-screen
  code_names:
  - screenArchive
  - photoArchive
  related:
  - retake
- id: roller
  term: Roller
  short: The wheel of steps. Scroll it or tap Next and Back; it never moves by itself.
  long: A tick marks a step that is done; a small dot marks the next step still needed. Every step has
    the same buttons - Photos, Back, Next, Cancel - and a greyed-out button says why.
  category: app-screen
  related:
  - photo-strip
- id: hint
  term: Tip
  short: A gentle suggestion, for example to add a base point. Tap OK to hide it; it never stops Next.
  long: Tips are advice only. The app suggests at least 3 base points, and when a photo point sees only 2
    it suggests where one more would help.
  category: app-screen
  code_names:
  - hintsFor
  related:
  - base-point
- id: tools
  term: Tools
  short: The menu button. Set-up, OneDrive, the error log, printing markers and the old screens live here.
  long: Home only shows Add point and Circle test. Everything else is under Tools.
  category: app-screen
  aliases:
  - menu
  - hamburger
