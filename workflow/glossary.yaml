- id: closure
  term: Closure
  short: 'App process after a measurement-layer outline is finished: accurate, acceptable, or redo.'
  long: 'Closure runs only on the measurement layer after you Close an object outline. It compares the
    closing gap (measured sample) with the closing uncertainty (propagated σ): accept when gap ≤ 1.96
    × uncertainty (1D) or the gap vector is inside the 2.45 (ELLIPSE_95) ellipse (2D), plus any absolute
    sub-layer cap. Outcomes: accurate (green — carry on), acceptable with Accept and continue noted (amber),
    or needs further measurement (red/amber). Baseline layer has no Closure.'
