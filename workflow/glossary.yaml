- id: measurement-strength
  term: Measurement strength
  short: How well a single tape measurement or photo click is checked by the others, and whether it agrees
    with them.
  long: 'Every observation gets two numbers after Adjust: redundancy r (0–1, shown via MDB = the smallest
    error it could reveal) for how well it is checked, and a w-test (residual ÷ expected size) for how
    far off it is. Colour is the worse of the two: green means checked and agreeing (|w| ≤ 1.96, r ≥ 0.3);
    amber means weakly checked (r 0.13–0.3, and for tapes also MDB ≤ 21 mm) or |w| between 1.96 and 3.29;
    red means |w| > 3.29; weak r < 0.13 shows amber regardless; grey unchecked (r < 0.01) reads “unchecked:
    add a tape or photo to check this” and is never green. The raw residual (measured minus adjusted,
    mm or px) is shown for information only and does not set colour, because poorly checked measurements
    hide errors. If the global variance test fails: banner “whole solve suspect”, remove the worst w (data
    snooping), then re-colour. Photos use a per-click 2-dof test (amber 5.99, red 13.8); photo colour
    is the worst click, plus a per-photo variance factor (wrong focal length, phone moved, or wrong photo).
    Camera position is a solved parameter: show its 95% ellipse versus 200 mm and how many checked clicks
    fix it. A baseline point fixed only by unchecked measurements cannot be green.'
  category: quality-check
