- id: frame
  term: Frame
  short: The single 2D garden coordinate system pinned by the default baseline.
  long: 'There is one horizontal frame for the garden. Hard constraints only: default baseline point 1
    at the origin, point 2 on the +X axis (Y = 0). +Y is the garden side. Layers do not have their own
