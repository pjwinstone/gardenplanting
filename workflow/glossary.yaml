- id: baseline
  term: Baseline
  short: A taped control edge on the baseline layer that helps pin the garden frame. In the circle field test, see base grid.
  long: A baseline is two baseline points with a taped length. The default baseline pins the frame (point
    1 at the origin, point 2 with Y = 0). A garden may store many baselines; extras reinforce the baseline
    layer as soft observations — there is no baseline loop and no Closure on this layer. If the default
    is unavailable, choose another from existing points or measure a new one.
