# glossary.yaml — single source of truth for Garden Planting terms.
#
# Purpose
#   - Agents read this file for stable ids and aliases when drafting nets, UI, or reviews.
#   - The app can show `short` as a tap-to-explain tooltip and `long` on a help screen.
#   - Paul is not a surveyor or Petri-net expert: keep short/long in plain English.
#
# Schema (each entry under `terms:`)
#   id          string   kebab-case, stable forever (do not rename; add aliases instead)
#   term        string   preferred display name on screen
#   short       string   one plain sentence, ~20 words max (tooltip)
#   long        string   2–4 plain sentences (help panel)
#   category    enum     survey | measurement | quality-check | workflow-model | app-screen
#   aliases     list     other names (legacy only; prefer `term`)
#   code_names  list     identifiers in src/ or survey.net.yaml
#   related     list     other term ids (must resolve)
#   units / example / shown_on — optional
#
# File-level:
#   reviewed_by — Geometry & Maths Advisor reviews applied to this glossary
#
# Naming (Paul + Geometry & Maths Advisor, 15 Oct 2026)
#   - Baseline / Point / Camera position (not Datum / Mark / Station).
#   - Camera position replaces camera-location and camera-setup (legacy aliases).
#   - Traverse = activity; Path = object; Closure primary on measurement layer only.
#   - Baseline layer has NO loop / NO Closure. Close/closing-gap = measurement layer.
#   - Geometric checks are soft observations with sigma; frame axes are hard constraints.
#   - chi-squared-test is preferred; chi-squared-closure id kept as legacy stub.
#   - closing-gap = measured misclosure; closing-uncertainty = propagated σ;
#     Closure: gap ≤ 1.96σ (1D) or inside 2.45 ellipse (2D).
#   - tape-measurement (not tape-reading);
#     repeat-tape / cross-tie are aliases of tape-measurement.
#   - quality-check replaces user-facing gate / walk gate.
#   - measurement-strength (named-reading is a legacy alias); grey = unchecked.
#   - focal-length stays; fx is code shorthand.
#   - Plurals add s. Many baselines; one default baseline pins the frame.
#
# Naming (Paul, 21 Oct 2026 — screen rebuild)
#   - Two point types: base point (always on the base layer) and photo point (any other layer:
#     boundary/railing, path, house/structure, bed). "Observation point" is not used.
#   - Grid north / grid east: Paul's own chosen directions along the house, not the compass.
#   - Screen wording lives in workflow/point.net.yaml (text:, hints:) and this glossary only.
#
# See also: advisor-review-2.md, constraints.example.yaml

