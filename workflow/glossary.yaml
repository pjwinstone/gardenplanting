- id: baseline-layer
  term: Baseline layer
  short: 'The control layer: baselines, baseline points, and the garden frame — not a loop.'
  long: The baseline layer holds baselines and their points and pins the garden frame. It has no loop
    and no Closure. Geometric checks here are soft observations with sigma; the only hard constraints
    are the frame (default baseline point 1 at the origin, point 2 with Y = 0). Sub-layers and measurement
    work must never move baseline points.
