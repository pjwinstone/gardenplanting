name: TestFlight

# Signing secrets are available to workflows in this repository. They are not
# available to pull requests from forks, and a pull request opened inside this
# repository would still receive them. This workflow therefore does not run on
# pull_request. Dispatch it by hand, or let a push to main upload when the
# four secrets below are set. If any secret is missing the job exits green
# and says so.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check signing secrets
        id: gate
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          [ -n "$KEY_ID" ] || { echo "APP_STORE_CONNECT_KEY_ID is absent."; missing=1; }
          [ -n "$ISSUER_ID" ] || { echo "APP_STORE_CONNECT_ISSUER_ID is absent."; missing=1; }
          [ -n "$P8" ] || { echo "APP_STORE_CONNECT_KEY_P8 is absent."; missing=1; }
          [ -n "$TEAM_ID" ] || { echo "APPLE_TEAM_ID is absent."; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Skipping TestFlight upload. One or more signing secrets are absent."
            echo "Required repository secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8, APPLE_TEAM_ID."
            echo "The unsigned iOS job on pull requests does not need these."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install and build the web app
        if: steps.gate.outputs.present == 'true'
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
          VITE_APP_VERSION: 0.7.25
          VITE_APP_BUILD: ${{ github.sha }}
        run: |
          npm ci
          npm run build:ios

      - name: Write the API key
        if: steps.gate.outputs.present == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8"; then
            printf '%b\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive and upload
        if: steps.gate.outputs.present == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          team = os.environ["TEAM_ID"]
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_text(
              """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>""" + team + """</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          """
          )
          PY
          # Cloud signing. Apple holds the distribution key. This is not fastlane match.
          # https://developer.apple.com/videos/play/wwdc2021/10204/
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Upload requested. TestFlight can take several minutes to show the build."
          rm -f "$RUNNER_TEMP/AuthKey.p8"
