# Version updates only. Security updates stay on GitHub's Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor and patch bumps. Major versions are not in
      # this group, so each major stays its own pull request.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for action minor and patch bumps. Major versions stay individual PRs.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
